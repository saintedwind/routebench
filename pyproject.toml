[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "routebench-local"
version = "0.1.1"
description = "Measure when a CPU intent router should classify, defer, or call a local model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["scikit-learn>=1.8,<2", "numpy>=2,<3", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1", "build>=1.3,<2"]
report = ["matplotlib>=3.9,<4"]

[project.scripts]
routebench = "routebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]
